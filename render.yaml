services:
  - type: web
    name: lavash-n1
    runtime: node
    branch: main
    plan: free
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: Daler
      - key: ADMIN_PASSWORD
        value: Daler
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
