<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lavash N1 — Admin</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body>
<div id="loginScreen" class="login-screen"><div class="login-box"><div class="login-logo">🌯</div><h1>Lavash N1</h1><p>Administrator paneli</p><form id="loginForm"><label>Telefon</label><input id="login" required placeholder="+998..."><label>Parol</label><input id="password" type="password" required><button class="primary-button">Kirish</button><div id="loginMessage" class="message"></div></form></div></div>
<div id="adminApp" class="admin-app hidden">
<aside class="sidebar"><div class="brand"><div class="brand-icon">🌯</div><div><strong>Lavash N1</strong><span>ADMIN</span></div></div>
<nav class="navigation">
<button class="nav-button active" data-page="dashboard">📊 Dashboard</button><button class="nav-button" data-page="orders">📦 Buyurtmalar</button><button class="nav-button" data-page="products">🍔 Mahsulotlar</button><button class="nav-button" data-page="promos">🎟️ Promo</button><button class="nav-button" data-page="customers">👥 Mijozlar</button>
</nav><button id="logoutButton" class="logout-button">🚪 Chiqish</button></aside>
<main class="main-content"><header class="top-header"><div><h2 id="pageTitle">Dashboard</h2><p id="pageSubtitle">Lavash N1 boshqaruv paneli</p></div><a href="/" class="admin-badge">🌐 Sayt</a></header>
<section id="dashboardPage" class="page"><div class="stats-grid"><div class="stat-card"><div class="stat-icon">📦</div><div><span>Buyurtmalar</span><strong id="ordersCount">0</strong></div></div><div class="stat-card"><div class="stat-icon">🍔</div><div><span>Mahsulotlar</span><strong id="productsCount">0</strong></div></div><div class="stat-card"><div class="stat-icon">👥</div><div><span>Mijozlar</span><strong id="customersCount">0</strong></div></div><div class="stat-card"><div class="stat-icon">💰</div><div><span>Savdo</span><strong id="salesTotal">0 so'm</strong></div></div></div><div id="todayStats" class="panel-card" style="padding:24px;margin-top:20px"></div></section>
<section id="ordersPage" class="page hidden"><div class="panel-card" style="padding:24px"><div class="panel-header"><h3>Buyurtmalar</h3><button id="refreshOrders" class="action-button">Yangilash</button></div><div id="ordersContainer"></div></div></section>
<section id="productsPage" class="page hidden"><div class="panel-card" style="padding:24px"><div class="panel-header"><h3>Mahsulotlar</h3><button id="addProductButton" class="form-submit">+ Mahsulot</button></div><div id="productsContainer" class="data-grid"></div></div></section>
<section id="promosPage" class="page hidden"><div class="panel-card" style="padding:24px"><div class="panel-header"><h3>Promo kodlar</h3><button id="addPromoButton" class="form-submit">+ Promo</button></div><div id="promosContainer" class="data-grid"></div></div></section>
<section id="customersPage" class="page hidden"><div class="panel-card" style="padding:24px"><h3>Mijozlar</h3><div id="customersContainer" class="data-grid"></div></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button id="closeModal" class="modal-close">×</button><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div>
<script src="/admin/admin.js"></script></body></html>
